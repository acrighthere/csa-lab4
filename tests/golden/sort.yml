in_source: "%define FLAG_DONE  0x200\n%define BUF_LEN    0x201\n%define IBUF     \
  \  0x202\n%define ARR_LEN    0x400\n%define ARR        0x401\n\n%define S0  0x500\n\
  %define S1  0x501\n%define S2  0x502\n%define S3  0x503\n%define S4  0x504\n%define\
  \ S5  0x505\n%define S6  0x506\n%define S7  0x507\n%define S8  0x508\n%define S9\
  \  0x509\n\n.org 0x000\n    .word isr_input\n\n.org 0x010\n_start:\n    DI\n   \
  \ PUSH 0\n    STOREA FLAG_DONE\n    PUSH 0\n    STOREA BUF_LEN\n    PUSH 0\n   \
  \ STOREA ARR_LEN\n\n    EI\n\n.wait:\n    LOADA FLAG_DONE\n    JZ .wait\n\n    DI\n\
  \n    LOADA BUF_LEN\n    PUSH IBUF\n    ADD\n    PUSH 0\n    SWAP\n    STORE\n\n\
  \    CALL parse_ints\n\n    CALL bubble_sort\n\n    CALL print_array\n\n    HALT\n\
  \nparse_ints:\n    PUSH IBUF\n    STOREA S0\n\n.pi_loop:\n    ; skip whitespace\n\
  \    LOADA S0\n    CALL skip_ws\n    STOREA S0\n\n    ; check end of string\n  \
  \  LOADA S0\n    LOAD\n    JZ .pi_done\n\n    ; parse one decimal number\n    LOADA\
  \ S0\n    CALL parse_num\n    LOADA S0\n\n    ; store ARR[ARR_LEN] = number\n  \
  \  LOADA ARR_LEN\n    PUSH ARR\n    ADD\n    STOREA S1\n    LOADA S3\n    LOADA\
  \ S1\n    SWAP\n    STORE\n\n    LOADA ARR_LEN\n    PUSH 1\n    ADD\n    STOREA\
  \ ARR_LEN\n\n    JMP .pi_loop\n\n.pi_done:\n    RET\n\nskip_ws:\n.sw_loop:\n   \
  \ DUP\n    LOAD\n    STOREA S4\n    LOADA S4\n    PUSH 32\n    EQ\n    JNZ .sw_advance\n\
  \    LOADA S4\n    PUSH 9\n    EQ\n    JNZ .sw_advance\n    LOADA S4\n    PUSH 10\n\
  \    EQ\n    JNZ .sw_advance\n    LOADA S4\n    PUSH 13\n    EQ\n    JNZ .sw_advance\n\
  \    RET\n\n.sw_advance:\n    PUSH 1\n    ADD\n    JMP .sw_loop\n\nparse_num:\n\
  \    STOREA S2           ; S2 = ptr\n    PUSH 0\n    STOREA S3           ; S3 =\
  \ 0 (accumulator)\n\n.pn_loop:\n    LOADA S2\n    LOAD                ; char\n \
  \   DUP\n    PUSH 48\n    LT\n    JNZ .pn_done        ; char < '0' -> stop\n   \
  \ DUP\n    PUSH 57\n    GT\n    JNZ .pn_done        ; char > '9' -> stop\n    ;\
  \ digit\n    PUSH 48\n    SUB                 ; digit value\n    LOADA S3\n    PUSH\
  \ 10\n    MUL\n    ADD\n    STOREA S3           ; S3 = S3*10 + digit\n    LOADA\
  \ S2\n    PUSH 1\n    ADD\n    STOREA S2           ; advance ptr\n    JMP .pn_loop\n\
  \n.pn_done:\n    POP                 ; discard char copy\n    ; store updated ptr\
  \ back to S0 (caller reads it)\n    LOADA S2\n    STOREA S0\n    RET\n\n%define\
  \ BS_I    0x510\n%define BS_J    0x511\n%define BS_N    0x512\n%define BS_AJ   0x513\n\
  %define BS_VJ   0x514\n%define BS_AJ1  0x515\n%define BS_VJ1  0x516\n\nbubble_sort:\n\
  \    LOADA ARR_LEN\n    STOREA BS_N\n    PUSH 0\n    STOREA BS_I\n\n.bs_outer:\n\
  \    ; if i >= n-1: done\n    LOADA BS_I\n    LOADA BS_N\n    PUSH 1\n    SUB\n\
  \    GE\n    JNZ .bs_done\n\n    PUSH 0\n    STOREA BS_J\n\n.bs_inner:\n    ; if\
  \ j >= n-1-i: next outer\n    LOADA BS_J\n    LOADA BS_N\n    PUSH 1\n    SUB\n\
  \    LOADA BS_I\n    SUB\n    GE\n    JNZ .bs_next_i\n\n    ; addr_j = ARR + j\n\
  \    LOADA BS_J\n    PUSH ARR\n    ADD\n    STOREA BS_AJ\n    LOADA BS_AJ\n    LOAD\n\
  \    STOREA BS_VJ\n\n    ; addr_j1 = addr_j + 1\n    LOADA BS_AJ\n    PUSH 1\n \
  \   ADD\n    STOREA BS_AJ1\n    LOADA BS_AJ1\n    LOAD\n    STOREA BS_VJ1\n\n  \
  \  ; if arr[j] <= arr[j+1]: no swap\n    LOADA BS_VJ\n    LOADA BS_VJ1\n    LE\n\
  \    JNZ .bs_no_swap\n\n    ; swap\n    LOADA BS_VJ1\n    LOADA BS_AJ\n    SWAP\n\
  \    STORE           ; mem[addr_j] = val_j1\n    LOADA BS_VJ\n    LOADA BS_AJ1\n\
  \    SWAP\n    STORE           ; mem[addr_j1] = val_j\n\n.bs_no_swap:\n    LOADA\
  \ BS_J\n    PUSH 1\n    ADD\n    STOREA BS_J\n    JMP .bs_inner\n\n.bs_next_i:\n\
  \    LOADA BS_I\n    PUSH 1\n    ADD\n    STOREA BS_I\n    JMP .bs_outer\n\n.bs_done:\n\
  \    RET\n\n%define PA_I  0x520\nprint_array:\n    PUSH 0\n    STOREA PA_I\n.pa_loop:\n\
  \    LOADA PA_I\n    LOADA ARR_LEN\n    GE\n    JNZ .pa_done\n    LOADA PA_I\n \
  \   PUSH ARR\n    ADD\n    LOAD\n    CALL print_int\n    PUSH 10\n    OUT 1\n  \
  \  LOADA PA_I\n    PUSH 1\n    ADD\n    STOREA PA_I\n    JMP .pa_loop\n.pa_done:\n\
  \    RET\n\n%define PI_VAL  0x530\n%define PI_BUF  0x531\n%define PI_LEN  0x53B\n\
  \nprint_int:\n    STOREA PI_VAL\n    LOADA PI_VAL\n    JNZ .pint_nz\n    PUSH 48\n\
  \    OUT 1\n    RET\n.pint_nz:\n    PUSH 0\n    STOREA PI_LEN\n.pint_ext:\n    LOADA\
  \ PI_VAL\n    JZ .pint_pr\n    LOADA PI_VAL\n    PUSH 10\n    MOD\n    PUSH 48\n\
  \    ADD\n    LOADA PI_LEN\n    PUSH PI_BUF\n    ADD\n    SWAP\n    STORE\n    LOADA\
  \ PI_VAL\n    PUSH 10\n    DIV\n    STOREA PI_VAL\n    LOADA PI_LEN\n    PUSH 1\n\
  \    ADD\n    STOREA PI_LEN\n    JMP .pint_ext\n.pint_pr:\n    LOADA PI_LEN\n  \
  \  PUSH 1\n    SUB\n    STOREA PI_LEN\n.pint_pl:\n    LOADA PI_LEN\n    PUSH 0\n\
  \    LT\n    JNZ .pint_done\n    LOADA PI_LEN\n    PUSH PI_BUF\n    ADD\n    LOAD\n\
  \    OUT 1\n    LOADA PI_LEN\n    PUSH 1\n    SUB\n    STOREA PI_LEN\n    JMP .pint_pl\n\
  .pint_done:\n    RET\n\nisr_input:\n    IN 0\n    DUP\n    JZ .isr_eof\n\n    LOADA\
  \ BUF_LEN\n    PUSH IBUF\n    ADD\n    SWAP\n    STORE\n\n    LOADA BUF_LEN\n  \
  \  PUSH 1\n    ADD\n    STOREA BUF_LEN\n    IRET\n\n.isr_eof:\n    POP         \
  \            \n    PUSH 1\n    STOREA FLAG_DONE\n    IRET\n"
