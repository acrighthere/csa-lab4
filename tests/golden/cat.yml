        28    12000200  LOADA 0x200(=0x0200)
        32    42000028  JNZ .exit(=0x0028)
        36    4000001c  JMP .wait_loop(=0x001c)
        40    47000000  HALT
        44    50000000  IN 0(=0x0000)
        48     3000000  DUP
        52    41000040  JZ .eof(=0x0040)
        56    51000001  OUT 1(=0x0001)
        60    62000000  IRET
        64     2000000  POP
        68     1000001  PUSH 1(=0x0001)
        72    13000200  STOREA 0x200(=0x0200)
        76    62000000  IRET
